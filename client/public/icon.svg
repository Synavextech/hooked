<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#roseGrad)" />
  <g filter="url(#glow)" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook Eyelet -->
    <circle cx="295" cy="120" r="28" stroke-width="20" fill="none" />
    <!-- Hook Shank -->
    <line x1="295" y1="148" x2="295" y2="280" stroke-width="36" />
    <!-- Hook Bend -->
    <path d="M 295 280 C 295 380 170 380 170 280 L 170 230" stroke-width="36" />
    <!-- Hook Barb / Point -->
    <polygon points="170,200 145,245 195,245" fill="#ffffff" stroke="none" />
  </g>
</svg>
